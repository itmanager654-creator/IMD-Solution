<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  
  <!-- 1. Google ko bolo is page ko index mat karo -->
  <meta name="robots" content="noindex, nofollow">
  
  <!-- 2. Canonical batao asal page konsa hai -->
  <link rel="canonical" href="https://www.intramedsolution.com/vascular-devices/" />
  
  <!-- 3. 0 second me redirect kar do -->
  <meta http-equiv="refresh" content="0; url=https://www.intramedsolution.com/vascular-devices/" />
  
  <!-- 4. Backup JS redirect -->
  <script>
    window.location.href = "https://www.intramedsolution.com/vascular-devices/";
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://www.intramedsolution.com/vascular-devices/">Vascular Devices</a>...</p>
</body>
</html>
